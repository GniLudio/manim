version: 2

sphinx:
  configuration: docs/source/conf.py

build:
  os: ubuntu-22.04

  tools:
    python: "3.13"

  apt_packages:
    - libpango1.0-dev
    - graphviz

  jobs:
    build:
      # Same as Read the Docs' default HTML build, plus ``-j auto`` to read
      # (and render the examples) and write in parallel.
      html:
        - cd docs/source && python -m sphinx -T -j auto -b html -d ../build/doctrees -D language=en . $READTHEDOCS_OUTPUT/html

python:
   install:
      - requirements: docs/rtd-requirements.txt
      - requirements: docs/requirements.txt
      - method: pip
        path: .
